name: tailscale-vpn-dev
services:
  tailscale:
    image: tailscale/tailscale:latest
    hostname: subnet-router-dev
    environment:
      - TS_AUTHKEY=${CLIENT_SECRET}
      - TS_ROUTES=172.28.5.0/24
      - TS_EXTRA_ARGS=--advertise-tags=tag:container --snat-subnet-routes=true #--dnat-subnet-routes=true
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
    volumes:
      - tailscale_state:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
    restart: unless-stopped
    networks:
      tailscale_net:
        ipv4_address: 172.28.5.4

  dns:
    image: 4km3/dnsmasq:2.90-r3
    command:
      - --no-resolv
      - --no-hosts
      - --keep-in-foreground
      - --log-facility=-
      - --domain=motohaus.internal
      - --local=/motohaus.internal/
      - --addn-hosts=/etc/dns/motohaus.internal.hosts
      - --listen-address=0.0.0.0
    cap_add:
      - NET_ADMIN                 # required by dnsmasq
    volumes:
      - ./motohaus.internal.hosts:/etc/dns/motohaus.internal.hosts:ro
    networks:
      tailscale_net:
        ipv4_address: 172.28.5.53
    restart: unless-stopped

  nginx-oauth-test:
    image: nginx
    networks:
      tailscale_net:
        ipv4_address: 172.28.5.5

    depends_on:
      - tailscale

volumes:
  tailscale_state:

networks:
  tailscale_net:
    ipam:
      config:
        - subnet: 172.28.5.0/24
